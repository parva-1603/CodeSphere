<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeSphere</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();

      // Prevent benign cross-origin / browser extension / ResizeObserver errors from triggering CRA error overlay
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || (!event.filename && !event.lineno)) {
          event.stopImmediatePropagation();
        }
        if (event.message && (event.message.indexOf('ResizeObserver') !== -1)) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'Script error.' || (typeof event.reason === 'string' && event.reason.indexOf('ResizeObserver') !== -1))) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
