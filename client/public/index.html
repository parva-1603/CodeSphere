<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeSphere</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();

      // Prevent benign cross-origin / browser extension / ResizeObserver / worker errors from triggering CRA error overlay
      function isBenign(msg, src) {
        var str = String(msg || '');
        var file = String(src || '');
        return str === 'Script error.' ||
               str.indexOf('ResizeObserver') !== -1 ||
               str.indexOf('editorWebWorker') !== -1 ||
               str.indexOf('editorWorkerService') !== -1 ||
               file.indexOf('editorWebWorker') !== -1;
      }
      window.addEventListener('error', function(event) {
        if (isBenign(event.message, event.filename) || (!event.filename && !event.lineno && !event.error)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.onerror = function(message, source) {
        if (isBenign(message, source)) {
          return true;
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        if (isBenign(msg, '')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
